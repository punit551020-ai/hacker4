<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="50%" stop-color="#1f2238" />
      <stop offset="100%" stop-color="#0e1018" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="50%" stop-color="#ff3d00" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#glowRing)" stroke-width="12" />
  
  <!-- Circuit Grid Lines -->
  <path d="M 64 256 H 448 M 256 64 V 448" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  
  <!-- Racing Checkered Wing Accents -->
  <g opacity="0.35">
    <rect x="156" y="360" width="25" height="20" fill="#ffffff" />
    <rect x="206" y="360" width="25" height="20" fill="#ffffff" />
    <rect x="281" y="360" width="25" height="20" fill="#ffffff" />
    <rect x="331" y="360" width="25" height="20" fill="#ffffff" />
    <rect x="181" y="380" width="25" height="20" fill="#ffffff" />
    <rect x="231" y="380" width="25" height="20" fill="#ffffff" />
    <rect x="306" y="380" width="25" height="20" fill="#ffffff" />
  </g>
  
  <!-- Racing Helmet Silhouette -->
  <g filter="url(#glow)">
    <!-- Helmet Dome -->
    <path d="M 170 270 C 170 170, 342 170, 342 270 C 342 330, 305 345, 256 345 C 207 345, 170 330, 170 270 Z" fill="#ff3b30" />
    <!-- Helmet Aerodynamic Fin -->
    <path d="M 246 160 Q 256 140 266 160 L 260 210 L 252 210 Z" fill="#ffffff" />
    <!-- Visor -->
    <path d="M 188 245 C 200 230, 312 230, 324 245 C 328 275, 310 290, 256 290 C 202 290, 184 275, 188 245 Z" fill="url(#visorGrad)" stroke="#ffffff" stroke-width="3" />
    <!-- Visor Glint -->
    <path d="M 200 248 Q 230 240 250 252" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
  
  <!-- Speed Flames / Boost Arrow -->
  <path d="M 216 420 L 256 390 L 296 420 L 256 405 Z" fill="#ffcc00" filter="url(#glow)" />
</svg>
